[package]
name = "npcterm"
version = "1.3.3"
edition = "2024"
description = "Headless terminal emulator for AI agents"
authors = ["Alejandro Quintanar"]
license = "Apache-2.0"
repository = "https://github.com/alejandroqh/npcterm"
homepage = "https://github.com/alejandroqh/npcterm"
readme = "README.md"
keywords = ["terminal", "mcp", "ai", "headless", "harness"]
categories = ["command-line-utilities", "emulators"]
exclude = [
    "dist/",
    "target/",
    ".claude/",
    ".claude-plugin/",
    "openclaw-plugin/",
    "CLAUDE.md",
    ".mcp.json",
    ".DS_Store",
    "build.sh",
    "benchmark.sh",
    "bench/",
]

[features]
default = ["viewer"]
viewer = ["dep:axum"]
gui = ["dep:winit", "dep:softbuffer", "dep:raw-window-handle", "dep:ab_glyph"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
portable-pty = "0.9"
vte = "0.15"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
turbomcp = "3"
turbomcp-server = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "sync"] }
schemars = "1"
axum = { version = "0.8", features = ["ws"], optional = true }
winit = { version = "0.29", optional = true }
softbuffer = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
ab_glyph = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[patch.crates-io]
portable-pty = { path = "local-crates/portable-pty-0.9.0" }
